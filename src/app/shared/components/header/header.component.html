<header class="header">
  <div class="header__left">
    <button
      class="header__nav header__nav--mobile"
      type="button"
      (click)="toggleMobileMenu()"
      [attr.aria-label]="isMenuOpen() ? 'Close menu' : 'Open menu'"
    >
      <span [ngClass]="isMenuOpen() ? 'pi pi-times' : 'pi pi-bars'"></span>
    </button>
    <figure class="header__logo"><img src="logo.png" alt="logo" /></figure>
  </div>
  <div class="header__right">
    <div class="header__avatar">
      @if (isLoadingProfileImage) {
        <p-skeleton shape="circle" [width]="isMobile ? '30px' : '50px'" [height]="isMobile ? '30px' : '50px'" />
      } @else {
        <app-drop-down class="dropdown">
          <div class="header__profile-trigger">
            @if (profileImageUrl) {
              <img
                [src]="profileImageUrl"
                alt="avatar"
                (error)="onImageError()"
              />
            } @else {
              <div class="header__avatar-fallback">
                <span class="header__avatar-text">{{ userName | slice:0:1 | uppercase }}</span>
              </div>
            }
            <i class="pi pi-chevron-down header__profile-chevron"></i>
          </div>
        </app-drop-down>
      }
    </div>
  </div>
</header>
