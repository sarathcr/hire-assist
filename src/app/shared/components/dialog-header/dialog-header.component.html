<div class="dialog-header">
  @if (data) {
    <h1 class="dialog-header__title">{{ data.headerTitle ?? "" }}</h1>
    @if (data.warningCount !== undefined && data.warningCount !== null) {
      <p-tag
        icon="pi pi-exclamation-triangle"
        severity="warn"
        [value]="'Remaining attempts : ' + data.warningCount"
      />
    }
  }
</div>
