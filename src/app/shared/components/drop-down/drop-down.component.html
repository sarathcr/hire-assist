<div class="dropdown" #dropdown>
  <button class="dropdown__trigger" (click)="toggleMenu($event)" [class.dropdown__trigger--active]="showMenu()">
    <ng-content></ng-content>
  </button>

  @if (showMenu()) {
    <div class="dropdown__flyout">
      <!-- User Info Header -->
      <div class="dropdown__header">
        <div class="dropdown__user-avatar">
          @if (profileImageUrl()) {
            <img [src]="profileImageUrl()" class="dropdown__avatar-img" alt="avatar" />
          } @else {
            <span class="dropdown__avatar-text">{{ userName() | slice:0:1 | uppercase }}</span>
          }
          <div class="dropdown__user-status-dot"></div>
        </div>
        <div class="dropdown__user-details">
          <p class="dropdown__user-name">{{ userName() }}</p>
          <span class="dropdown__user-role-badge">{{ userRole() }}</span>
        </div>
      </div>

      <div class="dropdown__divider"></div>

      <!-- Menu Items -->
      <nav class="dropdown__nav">
        <button class="dropdown__item" (click)="navigateToProfile()">
          <div class="dropdown__item-icon-wrapper">
            <i class="pi pi-user dropdown__item-icon"></i>
          </div>
          <div class="dropdown__item-text">
            <span class="dropdown__item-title">View Profile</span>
            <span class="dropdown__item-desc">Personal details & security</span>
          </div>
        </button>

        <button class="dropdown__item dropdown__item--logout" (click)="handleLogout()">
          <div class="dropdown__item-icon-wrapper">
            <i class="pi pi-sign-out dropdown__item-icon"></i>
          </div>
          <div class="dropdown__item-text">
            <span class="dropdown__item-title">Sign Out</span>
            <span class="dropdown__item-desc">End your active session</span>
          </div>
        </button>
      </nav>
    </div>
  }
</div>
