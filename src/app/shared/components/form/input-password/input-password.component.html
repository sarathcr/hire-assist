<div class="input-password" [formGroup]="formGroup">
  <p-floatlabel variant="on"
    ><p-password
      [id]="inputTextConfig.id"
      [toggleMask]="true"
      [feedback]="false"
      [formControlName]="inputTextConfig.id"
      [pKeyFilter]="$any(inputTextConfig.keyfilter)"
      (input)="onInputChange($event)"
    /><label for="over_label">{{
      inputTextConfig.labelKey
    }}@if (isRequired) {<span style="color: var(--color-danger); margin-left: 2px;">*</span>}</label></p-floatlabel
  >

  @if ((formControl.touched || formControl.dirty) && formControl.invalid) {
    <span class="input-password__validation-label"> {{ errorMsg }}</span>
  }
</div>
