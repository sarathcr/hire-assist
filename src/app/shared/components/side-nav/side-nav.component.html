<aside
  class="sidebar"
  [ngClass]="{ 
    sidebar_mobile: this.showMenu(), 
    sidebar_collapsed: collapsed() && !isMobileView() 
  }"
>
  <div class="sidebar__header">
    <figure class="sidebar__logo">
      <img src="logo.png" alt="logo" />
    </figure>

    <button
      type="button"
      class="sidebar__collapse-btn"
      (click)="toggleCollapse()"
      aria-label="Toggle sidebar"
    >
      <span
        class="sidebar__collapseIcon"
        [ngClass]="collapsed() ? 'pi pi-angle-double-right' : 'pi pi-angle-double-left'"
      ></span>
    </button>
    <button
      class="sidebar__close-btn pi pi-times-circle"
      type="button"
      tabindex="0"
      (click)="closeToggleMenu()"
      aria-label="Close menu"
    ></button>
  </div>

  <nav class="sidebar__nav" [class.sidebar__nav--with-subnav]="isMobileView() && isSettingsActive()">
    <div class="sidebar__nav-main">
      <p-panelmenu [model]="mainNavLinks"></p-panelmenu>
    </div>
    @if (isMobileView() && isSettingsActive()) {
      <div class="sidebar__mobile-subnav">
        <div class="sidebar__mobile-subnav-title">Settings</div>
        <div class="sidebar__mobile-subnav-links">
          @for (sub of settingsSublinks; track sub.route) {
            <a
              [routerLink]="sub.route"
              class="sidebar__mobile-subnav-link"
              [class.active]="isSublinkActive(sub.route)"
              (click)="closeToggleMenu()"
            >
              <i [class]="sub.icon"></i>
              <span>{{ sub.label }}</span>
            </a>
          }
        </div>
      </div>
    }
    <div class="sidebar__nav-footer" *ngIf="bottomNavLinks?.length">
      <p-panelmenu [model]="bottomNavLinks"></p-panelmenu>
    </div>
  </nav>
</aside>
