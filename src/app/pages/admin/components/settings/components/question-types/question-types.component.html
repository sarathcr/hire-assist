<div class="question-type">
  <div class="question-type__title">
    <h1>Question Types</h1>
  </div>

  <app-table
    [tableData]="data"
    [columnsData]="columns"
    [parentLoader]="isLoading"
    [hasSearch]="true"
    [hasCheckbox]="false"
    (edit)="editQuestionType($event)"
    (delete)="deleteQuestionType($event)"
    (history)="viewHistory($event)"
    (pageChangeAndSort)="onTablePayloadChange($event)"
    (buttonClick)="onButtonClick($event)"
  >
    <div class="question-type__button">
      <app-button
        [buttonLabel]="'New'"
        icon="pi pi-plus"
        (btnClick)="addNewQuestionType()"
      ></app-button>
    </div>
  </app-table>

  <app-history-drawer
    [(visible)]="visible"
    [events]="events"
    [loading]="historyLoading"
    [showLoadMore]="hasMoreHistory"
    (loadMore)="loadHistory()"
  ></app-history-drawer>
</div>
