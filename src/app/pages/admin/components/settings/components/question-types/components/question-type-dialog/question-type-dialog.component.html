<div class="question-type-form">
  <form [formGroup]="data.fGroup">
    <div class="question-type-form__field-container">
      <app-input-text
        class="question-type-form__field"
        [formGroup]="data.fGroup"
        type="text"
        [config]="data.configMap['questionType']"
      ></app-input-text>
    </div>
    <footer class="dialog-footer">
      <div class="dialog-footer__btn-wrapper">
        <app-button
          buttonLabel="Cancel"
          [buttonVariant]="'outlined'"
          (btnClick)="onClose()"
        ></app-button>
      </div>
      <div class="dialog-footer__btn-wrapper">
        <app-button
          buttonLabel="Submit"
          [disabled]="!data.fGroup.valid || isUnchanged"
          (btnClick)="onSubmit()"
        ></app-button>
      </div>
    </footer>
  </form>
</div>
