<div class="department">
  <div class="department__title">
    <h1>Departments</h1>
  </div>

  <!-- @if (!isLoading()) { -->
  <app-table
    [tableData]="data"
    [columnsData]="columns"
    [parentLoader]="isLoading"
    [hasSearch]="true"
    [hasCheckbox]="false"
    (edit)="editDepartment($event)"
    (delete)="deleteDepartment($event)"
    (history)="viewHistory($event)"
    (pageChangeAndSort)="onTablePayloadChange($event)"
    (buttonClick)="onButtonClick($event)"
  >
  </app-table>
  <app-history-drawer
    [(visible)]="visible"
    [events]="events"
    [loading]="historyLoading"
    [showLoadMore]="hasMoreHistory"
    (loadMore)="loadHistory()"
  ></app-history-drawer>
</div>
