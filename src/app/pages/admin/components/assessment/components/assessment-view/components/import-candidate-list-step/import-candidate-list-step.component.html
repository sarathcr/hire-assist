<div class="candidate">
  <!-- Header Section with Action Bar -->
  <div class="candidate__header-section">
    <div class="candidate__header-content">
      <div class="candidate__header-text">
        <h2 class="candidate__title">
          <i class="pi pi-users"></i>
          Import & Add Candidates to Recruitment Cycle
        </h2>
        <p class="candidate__description">
          Import candidates from CSV, manage your candidate list, and add them
          to the recruitment cycle
        </p>
      </div>
      <div class="candidate__header-actions">
        <span
          [pTooltip]="tooltipMessage"
          tooltipPosition="top"
          [tooltipDisabled]="!tooltipMessage"
        >
          <app-button
            class="candidate__schedule-btn"
            [buttonLabel]="'Enroll to Recruitment Cycle'"
            [disabled]="disableScheduleButton || isReadOnly()"
            (btnClick)="scheduleAssessment()"
          ></app-button>
        </span>
      </div>
    </div>
  </div>

  <!-- Action Toolbar -->
  <div class="candidate__toolbar">
    <div class="candidate__toolbar-group">
      <p-fileUpload
        [disabled]="importStatus || isUploading || isReadOnly()"
        mode="basic"
        accept=".csv"
        [maxFileSize]="50000000"
        label="Import CSV"
        chooseLabel="Import CSV"
        auto
        customUpload
        class="candidate__import-btn"
        [chooseButtonProps]="{ severity: 'secondary', icon: 'pi pi-upload' }"
        (uploadHandler)="onImport($event)"
      />
      <app-button
        class="candidate__action-btn"
        [disabled]="newStatus || isLoading || isReadOnly()"
        [buttonLabel]="'Add New'"
        [icon]="'pi pi-plus'"
        (btnClick)="addNewCandidate()"
      ></app-button>
    </div>
    <div class="candidate__toolbar-group">
      <span
        [pTooltip]="tooltipMessage"
        tooltipPosition="top"
        [tooltipDisabled]="!tooltipMessage"
      >
        <app-button
          class="candidate__action-btn candidate__action-btn--danger"
          [buttonLabel]="'Delete Selected'"
          [buttonSeverity]="'danger'"
          [icon]="'pi pi-trash'"
          [disabled]="disableDeleteSelectedButton || isReadOnly()"
          (btnClick)="deleteSelectedCandidates()"
        ></app-button>
      </span>
    </div>
  </div>

  <!-- Table Section -->
  <div class="candidate__table-section">
    <app-table
      class="candidate-table"
      [tableData]="data"
      [columnsData]="columns()"
      [hasSearch]="true"
      [parentLoader]="isLoading"
      [alreadySelected]="alreadySelectedCandidates"
      [enableCandidateStyling]="true"
      [selectionDisabled]="isReadOnly()"
      (delete)="deleteCandidate($event)"
      (selectedIds)="getSelectedItems($event)"
      (pageChangeAndSort)="onTablePayloadChange($event)"
      (buttonClick)="onButtonClick($event)"
      (unmaskAction)="handleUnmask($event)"
    >
    </app-table>
  </div>

  <app-history-drawer
    [visible]="visible"
    [events]="historyEvents"
    [loading]="historyLoading"
    [showLoadMore]="historyEvents.length < historyPagination.totalRecords"
    (visibleChange)="visible = $event"
    (loadMore)="loadMoreHistory()"
  ></app-history-drawer>
</div>
