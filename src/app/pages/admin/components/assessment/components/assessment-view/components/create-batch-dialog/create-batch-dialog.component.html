<div class="dialog" data-force-refresh="1">
  <div class="dialog__header">
    <h2>{{ candidateData?.title }}</h2>
  </div>

  @if (isLoading) {
    <div class="dialog__loading-wrapper" style="display: flex; flex-direction: column; gap: 1rem; padding: 1rem;">
      <p-skeleton width="100%" height="3rem"></p-skeleton>
      <p-skeleton width="100%" height="3rem"></p-skeleton>
      <p-skeleton width="100%" height="3rem"></p-skeleton>
      <p-skeleton width="100%" height="3rem"></p-skeleton>
    </div>
  } @else {
    <form [formGroup]="fGroup"></form>
    <app-input-select [formGroup]="fGroup" [config]="configMap['batch']" />

    @if (fGroup.get("batch")?.value) {
      @if (hasPrefilledDates) {
        <div class="batch-alert">
          <i class="pi pi-exclamation-triangle batch-alert__icon"></i>
          <span class="batch-alert__text">
            The prefilled date and time apply to all candidates in this batch. Changing them will update the schedule for every candidate already assigned to this batch.
          </span>
        </div>
      }
      <app-input-text-calender
        class="batch-form_field-col_one"
        [formGroup]="fGroup"
        [config]="configMap['startDate']"
        [showTime]="true"
        [minDate]="minDate"
        [maxDate]="maxDate"
        [hasDateError]="
          isDateChanged('startDate')
            ? 'Modifying the Start Date will update the entire batch schedule.'
            : ''
        "
      ></app-input-text-calender>

      <app-input-text-calender
        class="batch-form_field-col_one"
        [formGroup]="fGroup"
        [config]="configMap['endDate']"
        [showTime]="true"
        [minDate]="minDate"
        [maxDate]="maxDate"
        [hasDateError]="
          isDateChanged('endDate')
            ? 'Modifying the End Date will update the entire batch schedule.'
            : ''
        "
      >
      </app-input-text-calender>
      <app-input-select
        [formGroup]="fGroup"
        [config]="configMap['questionSet']"
      />
    }
  }
</div>

<footer class="dialog-footer">
  <div class="dialog-footer__btn-wrapper">
    <app-button
      buttonLabel="Cancel"
      [buttonVariant]="'outlined'"
      (btnClick)="onClose()"
    ></app-button>
  </div>
  <div class="dialog-footer__btn-wrapper">
    <app-button 
      buttonLabel="Submit" 
      (btnClick)="onSubmit()"
      [disabled]="isLoading"
    ></app-button>
  </div>
</footer>
